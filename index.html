<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official public website of the Gilbertown Police Department in Gilbertown, Alabama.">
  <title>Gilbertown Police Department | Gilbertown, Alabama</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #163a57;
      --navy-dark: #0d263b;
      --navy-deep: #081c2d;
      --navy-menu: #1c4666;
      --gold: #f4c430;
      --gold-dark: #bc8b00;
      --ivory: #fbfaf5;
      --paper: #ffffff;
      --ink: #172735;
      --muted: #607080;
      --red: #8e1f26;
      --line: rgba(22, 58, 87, 0.18);
      --shadow: 0 16px 42px rgba(8, 28, 45, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(
        180deg,
        #f4c430 0,
        #f8dc72 16rem,
        #fbf1c2 38rem,
        var(--ivory) 75rem,
        var(--ivory) 100%
      );
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    /* Emergency strip */

    .emergency-strip {
      padding: 9px 18px;
      color: #ffffff;
      background: var(--red);
      text-align: center;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .emergency-strip a {
      color: #ffffff;
    }

    /* Header and EXPLORE menu */

    .site-header {
      position: relative;
      z-index: 20;
      color: #ffffff;
      background: var(--navy);
      border-bottom: 9px solid var(--gold);
    }

    .masthead {
      min-height: 98px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
    }

    .brand {
      color: #ffffff;
      text-decoration: none;
      line-height: 1;
    }

    .brand-town {
      display: block;
      color: var(--gold);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.9rem, 4.6vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .brand-department {
      display: block;
      margin-top: 7px;
      color: #e6eef4;
      font-size: clamp(0.68rem, 1.7vw, 0.92rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .explore-button {
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 13px 17px;
      color: var(--navy-dark);
      background: var(--gold);
      border: 0;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition:
        background 0.28s ease,
        transform 0.28s ease,
        box-shadow 0.28s ease;
    }

    .explore-button:hover,
    .explore-button:focus {
      background: #ffe37b;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    .menu-icon {
      width: 20px;
      display: grid;
      gap: 4px;
    }

    .menu-icon span {
      display: block;
      height: 2px;
      background: var(--navy-dark);
    }

    .site-menu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-16px);
      visibility: hidden;
      background: var(--navy-menu);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      transition:
        max-height 0.78s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.36s ease,
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0.78s;
    }

    .site-menu.open {
      max-height: 650px;
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      transition:
        max-height 0.78s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.36s ease,
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 0 24px;
    }

    .site-menu a {
      display: block;
      padding: 15px 17px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      border-left: 3px solid transparent;
      transition:
        color 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease,
        padding-left 0.22s ease;
    }

    .site-menu a:hover,
    .site-menu a:focus,
    .site-menu a[aria-current="page"] {
      padding-left: 22px;
      color: var(--gold);
      background: rgba(255, 255, 255, 0.08);
      border-left-color: var(--gold);
      outline: none;
    }

    /* Full-width image carousel */

    .carousel {
      position: relative;
      overflow: hidden;
      color: #ffffff;
      background: var(--navy-dark);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide {
      position: relative;
      min-width: 100%;
      min-height: min(75vh, 710px);
      display: flex;
      align-items: end;
      overflow: hidden;
      background-color: #376a8a;
      background-position: center;
      background-size: cover;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 28, 45, 0.04) 0%,
        rgba(8, 28, 45, 0.08) 46%,
        rgba(8, 28, 45, 0.82) 100%
      );
    }

    .slide-1 {
      background-image:
        linear-gradient(125deg, #1d5277 0%, #4c88a9 55%, #88b5c9 100%),
        url("assets/images/carousel-about.jpg");
    }

    .slide-2 {
      background-image:
        linear-gradient(125deg, #234e69 0%, #5c94b1 55%, #9cc5d5 100%),
        url("assets/images/carousel-services.jpg");
    }

    .slide-3 {
      background-image:
        linear-gradient(125deg, #1e465f 0%, #6090a5 55%, #a2c8d2 100%),
        url("assets/images/carousel-community.jpg");
    }

    .slide-content {
      position: relative;
      z-index: 1;
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 0 0 78px;
    }

    .slide-text {
      width: min(520px, 100%);
      padding: 18px 0 0;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.62);
    }

    .slide-label {
      display: inline-block;
      margin-bottom: 10px;
      padding-bottom: 7px;
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .slide-text h1,
    .slide-text h2 {
      margin: 0;
      color: #ffffff;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.25rem, 5.2vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .slide-text p {
      margin: 13px 0 0;
      font-size: clamp(0.95rem, 1.8vw, 1.08rem);
