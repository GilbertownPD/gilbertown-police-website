<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official public website of the Gilbertown Police Department in Gilbertown, Alabama.">
  <title>Gilbertown Police Department | Gilbertown, Alabama</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071b2d;
      --navy-2: #0d2c47;
      --navy-3: #164a70;
      --gold: #f4c430;
      --gold-dark: #bd8f00;
      --ivory: #f8f7f3;
      --paper: #ffffff;
      --ink: #132331;
      --muted: #607080;
      --red: #8e1f26;
      --line: #dce4e9;
      --shadow: 0 18px 44px rgba(7, 27, 45, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--ivory);
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    .emergency-strip {
      padding: 9px 18px;
      color: #fff;
      background: var(--red);
      text-align: center;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .emergency-strip a {
      color: #fff;
    }

    .site-header {
      position: relative;
      z-index: 20;
      color: #fff;
      background: var(--navy);
      border-bottom: 4px solid var(--gold);
    }

    .masthead {
      min-height: 94px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      line-height: 1;
    }

    .brand-town {
      display: block;
      color: var(--gold);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.8rem, 4.4vw, 3.3rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .brand-department {
      display: block;
      margin-top: 6px;
      color: #e5eef5;
      font-size: clamp(0.68rem, 1.7vw, 0.91rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .explore-button {
      min-width: 136px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 13px 16px;
      color: var(--navy);
      background: var(--gold);
      border: 0;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .explore-button:hover,
    .explore-button:focus {
      background: #ffe073;
      transform: translateY(-1px);
      outline: none;
    }

    .menu-icon {
      width: 20px;
      display: grid;
      gap: 4px;
    }

    .menu-icon span {
      display: block;
      height: 2px;
      background: var(--navy);
    }

    .site-menu {
      max-height: 0;
      overflow: hidden;
      background: #0a243a;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      transition: max-height 0.35s ease;
    }

    .site-menu.open {
      max-height: 580px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      padding: 18px 0 22px;
    }

    .site-menu a {
      display: block;
      padding: 14px 16px;
      color: #fff;
      text-decoration: none;
      font-size: 0.93rem;
      font-weight: 700;
      border-left: 3px solid transparent;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .site-menu a:hover,
    .site-menu a:focus,
    .site-menu a[aria-current="page"] {
      color: var(--gold);
      background: rgba(255, 255, 255, 0.06);
      border-left-color: var(--gold);
      outline: none;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: var(--navy);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .slide {
      position: relative;
      min-width: 100%;
      min-height: min(73vh, 670px);
      display: flex;
      align-items: end;
      overflow: hidden;
      background-color: var(--navy);
      background-position: center;
      background-size: cover;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(95deg, rgba(5, 19, 32, 0.95) 0%, rgba(5, 19, 32, 0.80) 42%, rgba(5, 19, 32, 0.22) 100%);
    }

    .slide-1 {
      background-image:
        linear-gradient(120deg, #071b2d 0%, #123e60 56%, #1e6d95 100%),
        url("assets/images/carousel-about.jpg");
    }

    .slide-2 {
      background-image:
        linear-gradient(120deg, #10283a 0%, #245171 54%, #4b89ab 100%),
        url("assets/images/carousel-services.jpg");
    }

    .slide-3 {
      background-image:
        linear-gradient(120deg, #0c2030 0%, #1f4f68 53%, #5092a6 100%),
        url("assets/images/carousel-community.jpg");
    }

    .slide-content {
      position: relative;
      z-index: 1;
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 64px 0 105px;
    }

    .slide-panel {
      width: min(650px, 100%);
      padding: clamp(24px, 4vw, 42px);
      color: var(--navy);
      background: var(--gold);
      box-shadow: var(--shadow);
    }

    .slide-label {
      display: block;
      margin-bottom: 14px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .slide-panel h1,
    .slide-panel h2 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.25rem, 6vw, 5.05rem);
      font-weight: 700;
      line-height: 0.99;
      letter-spacing: -0.05em;
    }

    .slide-panel p {
      max-width: 540px;
      margin: 20px 0 0;
      font-size: clamp(0.98rem, 2vw, 1.18rem);
      font-weight: 500;
      line-height: 1.55;
    }

    .slide-button {
      display: inline-block;
      margin-top: 26px;
      padding: 14px 19px;
      color: #fff;
      background: var(--navy);
      border: 2px solid var(--navy);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .slide-button:hover,
    .slide-button:focus {
      color: var(--navy);
      background: #fff;
      outline: none;
    }

    .carousel-controls {
      position: absolute;
      z-index: 3;
      right: 4%;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carousel-control,
    .carousel-dot {
      color: #fff;
      background: rgba(7, 27, 45, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .carousel-control {
      min-width: 46px;
      min-height: 46px;
      padding: 8px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .carousel-control:hover,
    .carousel-control:focus,
    .carousel-dot:hover,
    .carousel-dot:focus {
      color: var(--navy);
      background: var(--gold);
      border-color: var(--gold);
      outline: none;
    }

    .carousel-dots {
      display: flex;
      gap: 8px;
    }

    .carousel-dot {
      width: 14px;
      height: 14px;
      padding: 0;
      border-radius: 50%;
    }

    .carousel-dot[aria-current="true"] {
      background: var(--gold);
      border-color: var(--gold);
    }

    main {
      padding: 64px 0 70px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--gold-dark);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--navy);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .section-heading > a {
      color: var(--navy-3);
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-heading > a:hover,
    .section-heading > a:focus {
      color: var(--gold-dark);
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 64px;
    }

    .quick-link {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 23px;
      color: #fff;
      background: var(--navy);
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(7, 27, 45, 0.12);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .quick-link:nth-child(2) {
      background: var(--navy-2);
    }

    .quick-link:nth-child(3) {
      color: var(--navy);
      background: var(--gold);
    }

    .quick-link:nth-child(4) {
      background: #244f70;
    }

    .quick-link:hover,
    .quick-link:focus {
      transform: translateY(-5px);
      outline: 3px solid rgba(244, 196, 48, 0.65);
      outline-offset: 2px;
    }

    .quick-link small {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .quick-link h3 {
      margin: 18px 0 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.65rem;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .quick-link span {
      margin-top: 18px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .information-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(290px, 0.75fr);
      gap: 24px;
    }

    .news-panel,
    .contact-panel {
      padding: clamp(24px, 3vw, 34px);
      background: var(--paper);
      box-shadow: 0 10px 24px rgba(7, 27, 45, 0.08);
    }

    .contact-panel {
      color: #fff;
      background: var(--navy);
      border-top: 6px solid var(--gold);
    }

    .contact-panel h2 {
      margin: 0 0 20px;
      color: #fff;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      line-height: 1.05;
    }
