<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official public website of the Gilbertown Police Department in Gilbertown, Alabama.">
  <title>Gilbertown Police Department | Gilbertown, Alabama</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #163a57;
      --navy-dark: #0d263b;
      --navy-deep: #081c2d;
      --navy-menu: #1c4666;
      --yellow: #ffd400;
      --yellow-dark: #bc8b00;
      --ivory: #fbfaf5;
      --ink: #172735;
      --muted: #607080;
      --red: #8e1f26;
      --line: rgba(22, 58, 87, 0.24);
      --shadow: 0 16px 42px rgba(8, 28, 45, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(
        180deg,
        #ffd400 0,
        #ffd400 56rem,
        #ffe451 82rem,
        #fff19d 112rem,
        #fff9dd 144rem,
        #fbfaf5 178rem,
        #fbfaf5 100%
      );
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(96vw, 1920px);
      margin: 0 auto;
    }

    .section-rule {
      position: relative;
      margin-bottom: 30px;
      padding-top: 25px;
      border-top: 2px solid var(--navy);
    }

    .section-rule::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 105px;
      height: 5px;
      background: var(--yellow-dark);
    }

    .section-kicker {
      margin: 0 0 7px;
      color: var(--navy);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      color: var(--navy-dark);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .section-link {
      display: inline-block;
      padding-bottom: 5px;
      color: var(--navy-dark);
      border-bottom: 2px solid var(--navy-dark);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .section-link:hover,
    .section-link:focus {
      color: var(--yellow-dark);
      border-color: var(--yellow-dark);
      transform: translateX(3px);
      outline: none;
    }

    .emergency-strip {
      width: 100%;
      padding: 9px 18px;
      color: #ffffff;
      background: var(--red);
      text-align: center;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .emergency-strip a {
      color: #ffffff;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .emergency-strip a:hover,
    .emergency-strip a:focus {
      color: var(--yellow);
      outline: none;
    }

    .site-header {
      position: relative;
      z-index: 20;
      width: 100%;
      color: #ffffff;
      background: var(--navy);
      border-bottom: 10px solid var(--yellow);
    }

    .masthead {
      min-height: 154px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 8px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      color: #ffffff;
      text-decoration: none;
    }

    .brand:hover .brand-badge,
    .brand:focus .brand-badge {
      transform: scale(1.04);
    }

    .brand-badge {
      width: 138px;
      height: 138px;
      max-width: none;
      object-fit: contain;
      flex: 0 0 auto;
      transition: transform 0.25s ease;
    }

    .brand-text {
      min-width: 0;
      line-height: 1;
    }

    .brand-town {
      display: block;
      color: var(--yellow);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.1rem, 4.9vw, 3.7rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .brand-department {
      display: block;
      margin-top: 9px;
      color: #e6eef4;
      font-size: clamp(0.75rem, 1.9vw, 1.02rem);
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .header-location {
      justify-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 68px;
      margin: 0 auto;
      padding: 0 34px;
      color: #dce8f2;
      border-left: 2px solid rgba(255, 212, 0, 0.85);
      border-right: 2px solid rgba(255, 212, 0, 0.85);
      text-align: center;
      text-decoration: none;
      line-height: 1.25;
      transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .header-location:hover,
    .header-location:focus {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }

    .header-location strong {
      display: block;
      color: var(--yellow);
      font-size: 0.79rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .header-location span {
      display: block;
      margin-top: 7px;
      color: #dce8f2;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .header-location:hover span,
    .header-location:focus span {
      color: #ffffff;
    }

    .explore-button {
      justify-self: end;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 13px 17px;
      color: var(--navy-dark);
      background: var(--yellow);
      border: 0;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.28s ease, transform 0.28s ease, box-shadow 0.28s ease;
    }

    .explore-button:hover,
    .explore-button:focus {
      background: #fff17c;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    .menu-icon {
      width: 20px;
      display: grid;
      gap: 4px;
    }

    .menu-icon span {
      display: block;
      height: 2px;
      background: var(--navy-dark);
    }

    .site-menu {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      background: var(--navy-menu);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      transition: grid-template-rows 1.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
    }

    .site-menu.open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .site-menu > .wrap {
      min-height: 0;
      overflow: hidden;
      transform: translateY(-24px);
      transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .site-menu.open > .wrap {
      transform: translateY(0);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 0 24px;
    }

    .site-menu a {
      display: block;
      padding: 15px 17px;
      color: #ffffff;
      opacity: 0;
      transform: translateY(-12px);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      border-left: 3px solid transparent;
      transition: color 0.22s ease, background 0.22s ease, border-color 0.22s ease, padding-left 0.22s ease, opacity 0.65s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .site-menu.open a {
      opacity: 1;
      transform: translateY(0);
    }

    .site-menu.open a:nth-child(1) { transition-delay: 0.16s; }
    .site-menu.open a:nth-child(2) { transition-delay: 0.22s; }
    .site-menu.open a:nth-child(3) { transition-delay: 0.28s; }
    .site-menu.open a:nth-child(4) { transition-delay: 0.34s; }
    .site-menu.open a:nth-child(5) { transition-delay: 0.40s; }
    .site-menu.open a:nth-child(6) { transition-delay: 0.46s; }
    .site-menu.open a:nth-child(7) { transition-delay: 0.52s; }
    .site-menu.open a:nth-child(8) { transition-delay: 0.58s; }
    .site-menu.open a:nth-child(9) { transition-delay: 0.64s; }
    .site-menu.open a:nth-child(10) { transition-delay: 0.70s; }

    .site-menu a:hover,
    .site-menu a:focus,
    .site-menu a[aria-current="page"] {
      padding-left: 22px;
      color: var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      border-left-color: var(--yellow);
      outline: none;
    }

    .carousel {
      position: relative;
      width: 100%;
      overflow: hidden;
      color: #ffffff;
      background: var(--navy-dark);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide {
      position: relative;
      min-width: 100%;
      min-height: min(75vh, 710px);
      display: flex;
      align-items: end;
      overflow: hidden;
      background-color: #376a8a;
      background-position: center;
      background-size: cover;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0) 76%,
        rgba(0, 0, 0, 0.08) 90%,
        rgba(0, 0, 0, 0.22) 100%
      );
    }

    .slide-1 {
      background-image: url("assets/images/carousel-about.jpeg");
    }

    .slide-2 {
      background-image: url("assets/images/carousel-services.jpeg");
    }

      background-image:
